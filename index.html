<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f0e8">
  <title>FLOW</title>
</head>
<body>
  <p id="status" style="font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:24px;color:#403b38">FLOWを読み込んでいます…</p>
  <script>
    (async () => {
      const status = document.getElementById('status');
      try {
        const response = await fetch('https://raw.githubusercontent.com/miutowa120215-ops/FLOW-app/main/README.md?cache=' + Date.now(), { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        let html = await response.text();
        // READMEにHTMLの前の文字が混入している場合、DOCTYPEから読み込む。
        const doctype = html.toLowerCase().indexOf('<!doctype html>');
        if (doctype >= 0) html = html.slice(doctype);
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        status.textContent = 'FLOWを読み込めませんでした。時間をおいて再読み込みしてください。';
        console.error('FLOW load failed:', error);
      }
    })();
  </script>
</body>
</html>
